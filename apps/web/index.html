<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <script src="/theme.js"></script>
  <title>Red Cola vs Blue Cola</title>
  <meta name="description" content="An educational game about AI safety risks and mitigation strategies.">
  <link rel="preload" href="/fonts/lobster-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <button type="button" class="brand" data-nav="home" aria-label="Red Cola versus Blue Cola: home">
        <span class="script" aria-hidden="true">Red Cola</span>
        <span class="vs-dot" aria-hidden="true">VS</span>
        <span class="punch" aria-hidden="true">Blue Cola</span>
      </button>
      <nav aria-label="Roles" class="nav">
        <button type="button" data-nav="red" data-icon="shield">Defend</button>
        <button type="button" data-nav="blue" data-icon="spy">Attack</button>
      </nav>
      <span class="mode-badge" title="Responses are scripted. No real AI model is used.">Simulated</span>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">Light mode</button>
    </div>
  </header>
  <main id="main" class="wrap" tabindex="-1">
    <p class="loading">Shaking the bottles…</p>
  </main>
  <footer class="wrap site-footer">
    Fictional companies, fictional recipe. Simulated responses illustrate risks; they do not measure a real model's behavior.
  </footer>
</body>
</html>
